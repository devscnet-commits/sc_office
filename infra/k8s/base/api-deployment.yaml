apiVersion: apps/v1
kind: Deployment
metadata:
  name: sc-office-api
  labels:
    app: sc-office-api
    version: "1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sc-office-api
  template:
    metadata:
      labels:
        app: sc-office-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/devscnet-commits/sc_office/api:latest
          ports:
            - containerPort: 3001
              name: http
            - containerPort: 9464
              name: metrics
          envFrom:
            - secretRef:
                name: sc-office-secrets
            - configMapRef:
                name: sc-office-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: sc-office-api
spec:
  selector:
    app: sc-office-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
    - name: metrics
      port: 9464
      targetPort: 9464
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sc-office-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sc-office-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
